name: POG Notify

on:
  # 金曜 21:00 JST = 金曜 12:00 UTC → 出走予定
  # 日曜 21:00 JST = 日曜 12:00 UTC → レース結果
  schedule:
    - cron: '0 12 * * 5'   # 金曜 21:00 JST
    - cron: '0 12 * * 0'   # 日曜 21:00 JST
  workflow_dispatch:
    inputs:
      mode:
        description: '実行モード (schedule / results)'
        required: true
        default: 'schedule'
        type: choice
        options:
          - schedule
          - results

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
          elif [ "$(date -u +%u)" = "5" ]; then
            echo "mode=schedule" >> $GITHUB_OUTPUT
          else
            echo "mode=results" >> $GITHUB_OUTPUT
          fi

      # 金曜の出走予定投稿時に生成される this_week_races.json を、日曜の結果
      # 投稿まで引き継ぐためのキャッシュ。netkeiba側の「次走情報」が既に次の
      # レース登録へ切り替わっていて結果が取得できないケースの補完に使う。
      # ISO週番号をキーにすることで金曜(schedule)→日曜(results)の同じ週の
      # 実行同士でのみ共有される。リポジトリへのpush権限は不要。
      - name: Compute week cache key
        id: cachekey
        run: echo "key=race-cache-$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore this week's race cache
        uses: actions/cache/restore@v4
        with:
          path: this_week_races.json
          key: ${{ steps.cachekey.outputs.key }}

      - name: Run notify
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python notify.py ${{ steps.mode.outputs.mode }}

      - name: Save this week's race cache
        if: steps.mode.outputs.mode == 'schedule'
        continue-on-error: true  # 同じ週にschedule実行を再実行した場合、キーが既存だと失敗するため
        uses: actions/cache/save@v4
        with:
          path: this_week_races.json
          key: ${{ steps.cachekey.outputs.key }}
