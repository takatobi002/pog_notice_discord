name: POG Notify

on:
  # 金曜 21:00 JST = 金曜 12:00 UTC → 出走予定
  # 日曜 21:00 JST = 日曜 12:00 UTC → レース結果
  schedule:
    - cron: '0 12 * * 5'   # 金曜 21:00 JST
    - cron: '0 12 * * 0'   # 日曜 21:00 JST
  workflow_dispatch:
    inputs:
      mode:
        description: '実行モード (schedule / results)'
        required: true
        default: 'schedule'
        type: choice
        options:
          - schedule
          - results

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
          elif [ "$(date -u +%u)" = "5" ]; then
            echo "mode=schedule" >> $GITHUB_OUTPUT
          else
            echo "mode=results" >> $GITHUB_OUTPUT
          fi

      - name: Run notify
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python notify.py ${{ steps.mode.outputs.mode }}

      # 出走予定（金曜）実行時に生成される this_week_races.json を保存しておく。
      # 日曜の結果取得時、netkeiba側の「次走情報」が既に次のレース登録へ
      # 切り替わっていて結果が取得できないケースの補完に使う。
      - name: Commit this week's race cache
        if: steps.mode.outputs.mode == 'schedule'
        run: |
          if [ -n "$(git status --porcelain this_week_races.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add this_week_races.json
            git commit -m "Update this week's race cache"
            git push
          fi
